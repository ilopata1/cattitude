<ion-app>
  <div
    class="alarm-banner"
    *ngIf="alarms.current() as notice"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
    [class.emergency]="notice.severity === 'emergency'"
  >
    <div class="alarm-copy">
      <strong>{{ notice.title }}</strong>
      <p>{{ notice.body }}</p>
    </div>
    <button type="button" class="alarm-action" (click)="openAlarm(notice)">
      {{ notice.actionLabel }}
    </button>
    <button type="button" class="alarm-dismiss" (click)="alarms.dismiss()" aria-label="Dismiss alert">
      Close
    </button>
  </div>
  <ion-router-outlet></ion-router-outlet>
  <app-photo-overlay></app-photo-overlay>
  <button
    *ngIf="kiosk.control() as control"
    type="button"
    class="kiosk-control"
    (click)="control === 'exit' ? kiosk.exit() : kiosk.toggleMenu()"
  >
    <ion-icon [name]="control === 'exit' ? 'contract-outline' : 'menu-outline'" aria-hidden="true"></ion-icon>
    {{ control === 'exit' ? 'Exit full screen' : (kiosk.menuRevealed() ? 'Hide menu' : 'Show menu') }}
  </button>
</ion-app>
