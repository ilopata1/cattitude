<app-header
  [title]="pageTitle"
  [showBack]="openedFromMore"
  [backTo]="openedFromMore ? 'more' : null"
></app-header>

<ion-content [fullscreen]="true" [scrollY]="false" class="sail-content">
<div class="sail-page">

  <div *ngIf="!hasSignalKUrl" class="no-connection">
    <div class="no-connection-icon"><ion-icon name="boat-outline" aria-hidden="true"></ion-icon></div>
    <h2 class="no-connection-title">Connect to Signal-K</h2>
    <p class="no-connection-body">
      Configure your vessel's Signal-K server URL in Settings to see live
      wind, depth, and speed instruments.
    </p>
    <ion-button [routerLink]="routes.tabs('more', 'settings')" color="primary" fill="solid">
      Open Settings
    </ion-button>
  </div>

  <div *ngIf="hasSignalKUrl" class="instruments">
    <app-wind-steer-panel></app-wind-steer-panel>
    <app-sail-essentials></app-sail-essentials>
  </div>

</div>
</ion-content>
