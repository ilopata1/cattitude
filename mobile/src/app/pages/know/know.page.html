<app-header></app-header>
<ion-content [fullscreen]="true" class="page-content">
  <div class="know-search">
    <ion-searchbar
      [(ngModel)]="query"
      placeholder="Search this boat..."
      debounce="200"
    ></ion-searchbar>
  </div>

  <div class="search-results" *ngIf="searching; else knowBrowse">
    <p class="search-empty" *ngIf="!searchGroups.length">Nothing in this guide matches that.</p>
    <section *ngFor="let group of searchGroups" class="search-group">
      <h2 class="section-label">{{ group.label }}</h2>
      <button
        type="button"
        class="search-hit"
        *ngFor="let hit of group.hits"
        (click)="openHit(hit)"
      >
        <span class="search-hit-title">{{ hit.title }}</span>
        <span class="search-hit-snippet">{{ hit.snippet }}</span>
      </button>
    </section>
  </div>

  <ng-template #knowBrowse>
  <ng-container *ngIf="!selected && !powerOpen">
    <div class="know-toggle">
      <button
        type="button"
        class="know-tog-btn"
        [class.active]="mode === 'topic'"
        (click)="setMode('topic')"
      >
        By Topic
      </button>
      <button
        type="button"
        class="know-tog-btn"
        [class.active]="mode === 'location'"
        (click)="setMode('location')"
      >
        By Location
      </button>
    </div>

    <div class="scroll-area" *ngIf="mode === 'topic'">
      <div class="sys-grid">
        <button
          class="sys-card"
          type="button"
          *ngFor="let topic of topics()"
          (click)="openTopic(topic)"
        >
          <span class="sys-icon">{{ topicIcon(topic) }}</span>
          <span class="sys-title">{{ topicTitle(topic) }}</span>
          <span class="sys-sub">{{ topicSubtitle(topic) }}</span>
        </button>
      </div>
    </div>

    <div class="loc-wrap" *ngIf="mode === 'location'">
      <div class="loc-intro">Tap a zone to see relevant systems</div>
      <div class="loc-grid">
        <button
          type="button"
          class="loc-btn"
          [class.sel]="selectedZone === item.id"
          *ngFor="let item of locationLayout"
          (click)="selectZone(item.id)"
        >
          {{ item.label }}
        </button>
      </div>
      <div class="loc-sys-panel" *ngIf="selectedZone as zoneId">
        <div class="loc-sys-title">Systems in: {{ zoneLabel(zoneId) }}</div>
        <button
          type="button"
          class="loc-sys-item"
          *ngFor="let topic of zoneTopics(zoneId)"
          (click)="openTopic(topic)"
        >
          <span class="loc-sys-icon">{{ topicIcon(topic) }}</span>
          <span class="loc-sys-name">{{ topicTitle(topic) }}</span>
          <span class="loc-sys-arrow">›</span>
        </button>
      </div>
    </div>
  </ng-container>

  <div class="detail-screen" *ngIf="selected as system">
    <div class="detail-header">
      <button type="button" class="sub-back" (click)="closeDetail()">‹</button>
      <div>
        <div class="detail-title">{{ system.title }}</div>
        <div class="detail-sub">{{ system.subtitle }}</div>
      </div>
    </div>
    <app-guide-chapter
      mode="chapter"
      [system]="system"
      [showFixes]="true"
      (systemLink)="openLinkedSystem($event)"
    ></app-guide-chapter>
  </div>

  <div class="detail-screen" *ngIf="powerOpen">
    <div class="detail-header">
      <button type="button" class="sub-back" (click)="closeDetail()">‹</button>
      <div>
        <div class="detail-title">Power</div>
        <div class="detail-sub">{{ powerView()?.subtitle }}</div>
      </div>
    </div>
    <app-guide-chapter
      mode="power"
      [showFixes]="true"
      (systemLink)="openLinkedSystem($event)"
    ></app-guide-chapter>
  </div>
  </ng-template>
</ion-content>
