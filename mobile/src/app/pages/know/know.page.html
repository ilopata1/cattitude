<app-header
  [title]="detailTitle"
  [subtitle]="detailSubtitle"
  [showBack]="detailOpen"
  (back)="closeDetail()"
></app-header>
<ion-content [fullscreen]="true" class="page-content">
  <div class="know-search">
    <ion-searchbar
      [(ngModel)]="query"
      placeholder="Search this boat..."
      debounce="200"
    ></ion-searchbar>
  </div>

  <div class="search-results" *ngIf="searching; else knowBrowse">
    <p class="search-empty" *ngIf="!searchGroups.length">
      Nothing in this guide matches that.
      <button type="button" class="search-ask" (click)="openAsk()">Ask the manuals</button>
    </p>
    <section *ngFor="let group of searchGroups" class="search-group">
      <h2 class="section-label">{{ group.label }}</h2>
      <button
        type="button"
        class="search-hit"
        *ngFor="let hit of group.hits"
        (click)="openHit(hit)"
      >
        <span class="search-hit-title">{{ hit.title }}</span>
        <span class="search-hit-snippet">{{ hit.snippet }}</span>
      </button>
    </section>
  </div>

  <ng-template #knowBrowse>
  <ng-container *ngIf="!selected && !powerOpen">
    <div class="know-toggle">
      <button
        type="button"
        class="know-tog-btn"
        [class.active]="mode === 'topic'"
        (click)="setMode('topic')"
      >
        By Topic
      </button>
      <button
        type="button"
        class="know-tog-btn"
        [class.active]="mode === 'location'"
        (click)="setMode('location')"
      >
        By Location
      </button>
    </div>

    <button type="button" class="boat-rules-entry" *ngIf="hasBoatRules" (click)="openRules()">
      <span class="boat-rules-title">Boat rules</span>
      <span class="boat-rules-sub">Never, always, and good habits</span>
    </button>

    <div class="scroll-area" *ngIf="mode === 'topic'">
      <div class="sys-grid">
        <button
          class="sys-card"
          type="button"
          *ngFor="let topic of topics()"
          (click)="openTopic(topic)"
        >
          <span class="sys-icon"><app-ui-icon [icon]="topicIcon(topic)" fallback="book-outline"></app-ui-icon></span>
          <span class="sys-title">{{ topicTitle(topic) }}</span>
          <span class="sys-sub">{{ topicSubtitle(topic) }}</span>
        </button>
      </div>
    </div>

    <div class="loc-wrap" *ngIf="mode === 'location'">
      <p class="loc-intro" *ngIf="!whereIndex.items.length">
        This guide has no equipment location list yet.
      </p>
      <ng-container *ngIf="whereIndex.items.length">
        <div class="loc-toggle">
          <button
            type="button"
            class="know-tog-btn"
            [class.active]="locList === 'az'"
            (click)="locList = 'az'"
          >
            A–Z
          </button>
          <button
            type="button"
            class="know-tog-btn"
            [class.active]="locList === 'zone'"
            (click)="locList = 'zone'"
          >
            By zone
          </button>
        </div>
        <div class="loc-sys-panel" *ngIf="locList === 'az'">
          <button
            type="button"
            class="loc-sys-item"
            *ngFor="let item of azItems()"
            (click)="openWhere(item)"
          >
            <span class="loc-sys-name">
              {{ item.name }}
              <span class="loc-sys-place">{{ item.location }}</span>
            </span>
            <span class="loc-sys-arrow" aria-hidden="true"><ion-icon name="chevron-forward"></ion-icon></span>
          </button>
        </div>
        <ng-container *ngIf="locList === 'zone'">
          <div class="loc-grid">
            <button
              type="button"
              class="loc-btn"
              [class.sel]="selectedZone === zone.id"
              *ngFor="let zone of whereIndex.zones"
              (click)="selectZone(zone.id)"
            >
              {{ zone.label }}
            </button>
          </div>
          <div class="loc-sys-panel" *ngIf="selectedZone as zoneId">
            <div class="loc-sys-title">{{ zoneTitle(zoneId) }}</div>
            <button
              type="button"
              class="loc-sys-item"
              *ngFor="let item of zoneItems(zoneId)"
              (click)="openWhere(item)"
            >
              <span class="loc-sys-name">
                {{ item.name }}
                <span class="loc-sys-place">{{ item.location }}</span>
              </span>
              <span class="loc-sys-arrow" aria-hidden="true"><ion-icon name="chevron-forward"></ion-icon></span>
            </button>
          </div>
        </ng-container>
      </ng-container>
    </div>
  </ng-container>

  <div class="detail-screen" *ngIf="selected as system">
    <app-guide-chapter
      mode="chapter"
      [system]="system"
      [showFixes]="true"
      (systemLink)="openLinkedSystem($event)"
    ></app-guide-chapter>
  </div>

  <div class="detail-screen" *ngIf="powerOpen">
    <app-guide-chapter
      mode="power"
      [showFixes]="true"
      (systemLink)="openLinkedSystem($event)"
    ></app-guide-chapter>
  </div>
  </ng-template>
</ion-content>
