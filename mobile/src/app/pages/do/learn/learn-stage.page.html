<app-header
  [title]="stage?.title || 'Learn the boat'"
  [showBack]="true"
  (back)="back()"
></app-header>
<ion-content [fullscreen]="true" class="page-content">
  <div class="acc-list" *ngIf="stage as current">
    <button
      type="button"
      class="acc-header acc-item"
      *ngFor="let lesson of current.lessons"
      (click)="open(lesson)"
    >
      <div class="acc-text">
        <div class="acc-title">{{ lessonTitle(lesson) }}</div>
        <div class="acc-sub">{{ lessonSubtitle(lesson) }}</div>
        <div class="acc-sub" *ngIf="label(lesson)">{{ label(lesson) }}</div>
      </div>
      <div class="acc-chevron" aria-hidden="true"><ion-icon name="chevron-forward"></ion-icon></div>
    </button>
  </div>
</ion-content>
