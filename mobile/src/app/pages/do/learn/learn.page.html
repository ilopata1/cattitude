<app-header></app-header>
<ion-content [fullscreen]="true" class="page-content">
  <div class="sub-header">
    <button type="button" class="sub-back" (click)="back()">‹</button>
    <div>
      <div class="sub-header-title">🛥️ Learn the Boat</div>
      <div class="sub-header-sub">{{ content.bootstrap.branding.vesselName }} · review each system on boarding</div>
    </div>
  </div>

  <div class="learn-prog-wrap">
    <div class="learn-prog-top">
      <span class="learn-prog-label">{{ progress.learnProgressLabel() }}</span>
      <span class="learn-prog-count">
        {{ progressState.done }} / {{ progressState.total }}
      </span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" [style.width.%]="progressState.percent"></div>
    </div>
  </div>

  <div class="acc-list">
    <div
      class="acc-item"
      *ngFor="let row of rows"
      [class.open]="openId === row.id"
    >
      <button type="button" class="acc-header" (click)="toggleOpen(row.id)">
        <div class="acc-icon">{{ row.icon }}</div>
        <div class="acc-text">
          <div class="acc-title">{{ row.title }}</div>
          <div class="acc-sub">{{ row.subtitle }}</div>
        </div>
        <div
          class="acc-check"
          [class.done]="isDone(row)"
          (click)="toggleDone(row, $event)"
        >
          {{ isDone(row) ? '✓' : '' }}
        </div>
        <span class="acc-chevron">›</span>
      </button>
      <div class="acc-body" *ngIf="openId === row.id">
        <div class="acc-section" *ngIf="row.summary">
          <div class="acc-prose">{{ row.summary }}</div>
        </div>
        <div class="acc-section" *ngIf="row.checks.length">
          <div class="acc-sec-title">Review checklist</div>
          <ul class="li-list">
            <li *ngFor="let item of row.checks">
              <button type="button" class="check-row" (click)="toggleCheck(item.system, item.check)">
                <span class="acc-check" [class.done]="isCheckDone(item.system, item.check)">
                  {{ isCheckDone(item.system, item.check) ? '✓' : '' }}
                </span>
                <span>{{ checkText(item.check) }}</span>
              </button>
            </li>
          </ul>
        </div>
        <button
          type="button"
          class="open-detail-btn"
          (click)="openSystemDetail(row.id, $event)"
        >
          Open full system guide →
        </button>
      </div>
    </div>
  </div>
</ion-content>
