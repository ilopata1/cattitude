<app-header></app-header>
<ion-content [fullscreen]="true" class="page-content">
  <div class="sub-header">
    <button type="button" class="sub-back" (click)="back()">‹</button>
    <div>
      <div class="sub-header-title">Learn the boat</div>
      <div class="sub-header-sub">A short path through this boat</div>
    </div>
  </div>

  <div class="acc-list">
    <button type="button" class="acc-header acc-item" *ngFor="let stage of stages" (click)="open(stage)">
      <div class="acc-text">
        <div class="acc-title">{{ stage.title }}</div>
        <div class="acc-sub">{{ label(stage) }}</div>
      </div>
      <div class="acc-chevron">›</div>
    </button>
  </div>
</ion-content>
