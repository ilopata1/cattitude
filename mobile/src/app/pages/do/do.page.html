<app-header></app-header>
<ion-content [fullscreen]="true" class="page-content">
  <div class="scroll-area do-menu">
    <section class="do-section" *ngIf="learnCard as learn">
      <div class="section-label">Learn</div>
      <button type="button" class="do-card learn-card" (click)="open(learn.route)">
        <div class="do-card-icon" [ngClass]="learn.iconClass">
          <app-ui-icon [icon]="learn.icon" fallback="school-outline"></app-ui-icon>
        </div>
        <div class="do-card-body">
          <div class="do-card-title">{{ learn.title }}</div>
          <div class="do-card-sub">{{ learn.subtitle }}</div>
          <div class="do-card-prog">{{ progressLabel(learn.key, 'learn') }}</div>
          <div class="learn-stage" *ngFor="let stage of learnStages; trackBy: trackStage">
            {{ stage.title }}<span *ngIf="stage.progress"> · {{ stage.progress }}</span>
          </div>
        </div>
        <div class="do-card-arrow" aria-hidden="true"><ion-icon name="chevron-forward"></ion-icon></div>
      </button>
    </section>
    <section class="do-section" *ngFor="let section of menu; trackBy: trackSection">
      <div class="section-label" *ngIf="section.label">{{ section.label }}</div>
      <div class="do-cards">
      <button
        type="button"
        class="do-card"
        *ngFor="let item of section.items; trackBy: trackItem"
        (click)="open(item.route)"
      >
        <div class="do-card-icon" [ngClass]="item.iconClass">
          <app-ui-icon [icon]="item.icon" fallback="checkmark-circle-outline"></app-ui-icon>
        </div>
        <div class="do-card-body">
          <div class="do-card-title">{{ item.title }}</div>
          <div class="do-card-sub">{{ item.subtitle }}</div>
          <div class="do-card-prog" *ngIf="progressLabel(item.key, item.progressType) as label">
            {{ label }}
          </div>
        </div>
        <div class="do-card-arrow" aria-hidden="true"><ion-icon name="chevron-forward"></ion-icon></div>
      </button>
      </div>
    </section>
  </div>
</ion-content>
