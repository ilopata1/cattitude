<svg viewBox="0 0 100 14" preserveAspectRatio="none" aria-hidden="true">
  <rect class="track" x="0" y="0" width="100" height="14" />
  @for (zone of zoneRects(); track zone.x + zone.tone) {
    <rect [class]="zone.tone" [attr.x]="zone.x" y="0" [attr.width]="zone.width" height="14" />
  }
  @if (fillWidth() != null) {
    <rect class="fill" x="0" y="0" [attr.width]="fillWidth()" height="14" />
  }
</svg>
