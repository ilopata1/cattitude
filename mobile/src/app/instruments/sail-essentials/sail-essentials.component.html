<div class="essentials" [class.stale]="essentials().stale">
  <div class="card">
    <span class="label cs-kicker">
      Depth
      <span class="cs-stale-flag">Stale</span>
    </span>
    <span class="value cs-value">
      {{ depthParts().figure }}
      @if (depthParts().unit) {
        <span class="cs-unit" [class.cs-unit-tight]="depthParts().tight">{{ depthParts().unit }}</span>
      }
    </span>
    <cs-sparkline [values]="depthTrace()"></cs-sparkline>
  </div>
  <div class="card">
    <span class="label cs-kicker">
      Speed
      <span class="cs-stale-flag">Stale</span>
    </span>
    <span class="value cs-value">
      {{ speedParts().figure }}
      @if (speedParts().unit) {
        <span class="cs-unit" [class.cs-unit-tight]="speedParts().tight">{{ speedParts().unit }}</span>
      }
    </span>
    <cs-sparkline [values]="speedTrace()"></cs-sparkline>
  </div>
</div>
