@if (dialStyle.style() === 'modern') {
  <cs-compass-card
    [heading]="compass().heading"
    [reference]="compass().ref"
    [fresh]="wind().headingFresh"
    [cog]="wind().cogFresh ? compass().cog : null"
    [awa]="wind().awaFresh ? wind().awa : null"
    [twa]="wind().twaFresh ? compass().twd : null"
  ></cs-compass-card>
} @else {
<svg-windsteer
  [compassHeading]="compass().heading"
  [headingReference]="compass().ref"
  [compassModeEnabled]="true"
  [updateInterval]="displayPublishMs"
  [courseOverGroundAngle]="compass().cog ?? NaN"
  [courseOverGroundEnabled]="true"
  [sogActive]="true"
  [trueWindAngle]="compass().twd ?? NaN"
  [trueWindFresh]="wind().twaFresh && compass().twd != null"
  [twsEnabled]="true"
  [twaEnabled]="true"
  [trueWindSpeed]="wind().tws"
  [trueWindSpeedUnit]="'kn'"
  [appWindAngle]="wind().awa"
  [awsEnabled]="true"
  [appWindSpeed]="wind().aws"
  [appWindSpeedUnit]="'kn'"
  [laylineAngle]="40"
  [closeHauledLineEnabled]="true"
  [windSectorEnabled]="false"
  [driftEnabled]="false"
  [driftActive]="false"
  [driftUnit]="''"
  [driftFlow]="0"
  [driftSet]="0"
  [waypointEnabled]="false"
  [sailSetupEnabled]="false"
  [rudderEnabled]="false"
  [headingFresh]="wind().headingFresh"
  [courseFresh]="wind().cogFresh && compass().cog != null"
  [appWindFresh]="wind().awaFresh"
  [appWindSpeedFresh]="wind().awsFresh"
  [trueWindSpeedFresh]="wind().twsFresh"
  [driftFresh]="false"
  [setFresh]="false"
></svg-windsteer>
}
