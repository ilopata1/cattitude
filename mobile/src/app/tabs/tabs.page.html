<ion-tabs>
  <ion-tab-bar slot="bottom" class="bottom-nav">
    <ion-tab-button tab="home">
      <ion-icon name="home" aria-hidden="true"></ion-icon>
      <ion-icon name="home-outline" aria-hidden="true"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>
    <ion-tab-button *ngIf="showSailTab" tab="sail">
      <ion-icon name="compass" aria-hidden="true"></ion-icon>
      <ion-icon name="compass-outline" aria-hidden="true"></ion-icon>
      <ion-label>Sail</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="do">
      <ion-icon name="checkbox" aria-hidden="true"></ion-icon>
      <ion-icon name="checkbox-outline" aria-hidden="true"></ion-icon>
      <ion-label>Do</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="know">
      <ion-icon name="book" aria-hidden="true"></ion-icon>
      <ion-icon name="book-outline" aria-hidden="true"></ion-icon>
      <ion-label>Know</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="fix">
      <ion-icon name="build" aria-hidden="true"></ion-icon>
      <ion-icon name="build-outline" aria-hidden="true"></ion-icon>
      <ion-label>Fix</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="more">
      <ion-icon name="ellipsis-horizontal" aria-hidden="true"></ion-icon>
      <ion-icon name="ellipsis-horizontal-outline" aria-hidden="true"></ion-icon>
      <ion-label>More</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
