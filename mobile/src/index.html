<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Clever Sailor</title>

  <base href="/">

  <meta name="color-scheme" content="light" />
  <script>
    /* Applies the stored theme before first paint. Keep in sync with ThemeService. */
    (function () {
      var key = 'cattitude.theme';
      var pref = 'system';
      try {
        var stored = localStorage.getItem(key);
        if (stored === 'light' || stored === 'dark' || stored === 'night' || stored === 'system') {
          pref = stored;
        }
      } catch (e) {}
      var dark = false;
      try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
      var theme = pref === 'system' ? (dark ? 'dark' : 'light') : pref;
      var root = document.documentElement;
      root.setAttribute('data-theme', theme);
      root.style.colorScheme = theme === 'light' ? 'light' : 'dark';
      var scheme = document.querySelector('meta[name="color-scheme"]');
      if (scheme) scheme.setAttribute('content', theme === 'light' ? 'light' : 'dark');
      var bar = document.querySelector('meta[name="theme-color"]');
      if (bar) bar.setAttribute('content', theme === 'night' ? '#240808' : '#0D2137');
    })();
  </script>
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0D2137" />
  <meta name="apple-mobile-web-app-title" content="Clever Sailor" />
</head>

<body>
  <app-root></app-root>
</body>

</html>
