<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Clever Sailor</title>

  <base href="/">
  <script>
    (function () {
      if (location.hostname !== "app.sailsupernova.com") return;
      var path = location.pathname;
      var next = path;
      if (path === "/" || path === "") {
        next = "/v/supernova/tabs/home";
      } else if (path === "/tabs" || path.indexOf("/tabs/") === 0) {
        next = "/v/supernova" + path;
      } else if (path === "/v/cattitude" || path.indexOf("/v/cattitude/") === 0) {
        next = "/v/supernova" + path.slice("/v/cattitude".length);
      }
      if (next !== path) location.replace(next + location.search + location.hash);
    })();
  </script>

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0D2137" />
  <meta name="apple-mobile-web-app-title" content="Clever Sailor" />
</head>

<body>
  <app-root></app-root>
</body>

</html>
