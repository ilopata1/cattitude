# Purpose: Guest handbook sections merged onto the Electrical system after generation.
# Used by: content.assembler.apply_guest_layers
# Module: system / electrical
#

learnChecks:
- key: electrical/unused-load
  c: Switched off something that was not in use
- key: electrical/dark
  c: Told the skipper when everything went dark
sections:
- t: Using electricity
  type: list
  items:
  - c: Electricity is limited, except when the boat is on shore power.
  - c: Switch off anything that is not in use.
  - c: Heating water is one of the large electrical loads.
    when:
      has_water_heater: true
  - c: Air conditioning is one of the large electrical loads.
    when:
      has_category:
      - hvac
  - c: Cooking is one of the large electrical loads.
    when:
      has_category:
      - galley_appliances
  - c: Some switches dim when you hold them.
    when:
      hold_to_dim: true
  - c: If everything goes dark at once, tell the skipper. Do not reset anything yourself.
