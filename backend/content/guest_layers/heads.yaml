# Purpose: Guest handbook sections merged onto the Heads system after generation.
# Used by: content.assembler.apply_guest_layers
# Module: system / heads
#

summary: >-
  The heads on {vessel_name} flush with {heads_flush_phrase}. Nothing but human
  waste goes in them. Paper goes in the bin.
crew_summary_section: How the waste system is set up

learnChecks:
- key: heads/bowl
  c: Left a little water in the bowl and put paper in the bin
- key: heads/bin
  c: Left the bin lid on and emptied it ashore
sections:
- t: Using the heads
  type: list
  items:
  - c: These heads flush with fresh water, so every flush counts against the tanks.
    when:
      heads_flush_fresh: true
  - c: These heads flush with seawater.
    when:
      heads_flush_sea: true
  - c: If the toilet will not flush, the water pump is probably off. Ask before you assume the tank is full.
  - c: Press the flush button once. Do not hold it unless you are shown to.
    when:
      heads_drive: electric
  - c: If the holding tank is full, the flush stops working. Say so.
  - c: Keep the toilet roll where it cannot get wet.
  - c: Leave a little water in the bowl when you finish.
  - c: If you are unsure, ask for a demonstration.
- t: The bin
  type: list
  items:
  - c: Keep the lid on.
  - c: Empty it ashore.
  - c: Nothing wet goes in it.
