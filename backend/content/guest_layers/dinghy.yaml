# Purpose: Guest handbook sections merged onto the tender and swim-platform system.
# Used by: content.assembler.apply_guest_layers
# Module: system / dinghy
#

learnChecks:
- key: dinghy/rules
  c: Asked before taking the dinghy
  when:
    has_category:
    - tenders_and_watersports
- key: dinghy/swimming
  c: Confirmed when swimming is allowed and where the ladder is
sections:
- t: Dinghy rules
  type: list
  when:
    has_category:
    - tenders_and_watersports
  items:
  - c: Ask before you take it.
  - c: The kill cord stays on the driver.
  - c: Wear life jackets at night, and if you are not a strong swimmer.
  - c: Tie it with a round turn and two half hitches.
  - c: Do not go alone after dark.
  - c: Lift the outboard before you beach it.
- t: Swimming
  type: list
  items:
  - c: Swim only when the skipper says it is safe, and always tell someone you are swimming.
  - c: The engines should be off, and stay clear of the propellers anyway.
  - c: Watch the current and passing boats.
  - repeat: swim_ladders
