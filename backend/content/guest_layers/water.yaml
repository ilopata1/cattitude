# Purpose: Guest handbook sections merged onto the Water system after generation.
# Used by: content.assembler.apply_guest_layers
# Module: system / water
#

learnChecks:
- key: water/source
  c: Can say where the fresh water comes from
  when:
    any:
    - has_water_tanks_sentence: true
    - has_hot_water_sentence: true
- key: water/maker
  c: Can say what the watermaker is for
  when:
    has_watermaker: true
- key: water/shower
  c: Practised a short shower and found the shower-tray pump switch
sections:
- t: Where the water comes from
  type: list
  when:
    any:
    - has_water_tanks_sentence: true
    - has_hot_water_sentence: true
  items:
  - c: "{water_tanks_sentence}"
    when:
      has_water_tanks_sentence: true
  - c: "{hot_water_sentence}"
    when:
      has_hot_water_sentence: true
  - c: If there is no hot water, that is usually why. Ask before you report it.
- t: What the watermaker is
  type: list
  when:
    has_watermaker: true
  items:
  - c: It makes fresh water from the sea while we are under way or on the generator.
  - c: It is why we can shower at anchor.
  - c: Never connect a town-water hose to fill the tanks unless you are asked.
  - c: You may be asked to say when a tank gauge reaches 90 percent.
- t: Using fresh water
  type: list
  items:
  - c: Hot water is limited. Take short showers and never leave a tap running.
  - c: Report a dripping tap, a tap with no flow, and any pump that seems to be running when it should not.
- t: Showers
  type: list
  items:
  - c: Keep the water in the shower tray, not on the floor.
  - c: Do not expect a long hot shower. There may be no hot water at all.
  - c: Either run the shower briefly so the tray does not fill, then empty it with {shower_pump_switch}, or switch that pump on while you shower and switch it off afterwards.
  - c: In port, use the marina showers and toilets when they are available. That saves water and fills the holding tanks more slowly.
