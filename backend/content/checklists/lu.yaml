# Purpose: lu checklist content.
# Used by: content.assembler.build_checklist_module
# Module: checklist / lu
# Slots: {vessel_name}, {company}, {engine_group_title}, etc.
# Alternates that share a key: the first match is kept.
#

groups:
- key: lu/power
  t: Power & Systems
  items:
  - key: lu/nonessential
    c: Non-essential DC breakers off
    s: 'Leave: fridge ON, bilge pumps AUTO, anchor light if night'
  - key: lu/generator-off
    c: Generator off
    s: Confirm it is shut down
    when:
      has_generator: true
  - key: lu/inverter-off
    c: Inverter off
    s: Confirm it is shut down
    when:
      has_category:
      - electrical_ac
  - key: lu/ac-off
    c: Air conditioning off
    when:
      has_category:
      - hvac
  - key: lu/watermaker-off
    c: Watermaker off
    when:
      has_watermaker: true
- key: lu/water
  t: Water
  items:
  - key: lu/water-pump
    c: Fresh water pressure pump off
    s: Prevents pumping the tanks dry if a hose fails while you're ashore
    when:
      has_category:
      - fresh_water_and_plumbing
- key: lu/security
  t: Security
  items:
  - key: lu/hatches
    c: All hatches closed and secured
    s: Squalls can arrive fast — never leave hatches open
  - key: lu/dinghy
    c: Dinghy secured — davits raised fully, straps buckled
    when:
      tender_launch: davits
  - key: lu/dinghy
    c: Dinghy secured — platform raised fully, straps buckled
    when:
      tender_launch: platform
  - key: lu/dinghy
    c: Dinghy secured
    when:
      tender_launch: unset
  - key: lu/loose-items
    c: Loose items stowed below or in lockers
    s: Cushions, fishing rods, gear — all away
  - key: lu/vhf
    c: VHF off
    s: No point monitoring Ch 16 with no one aboard to hear it
  - key: lu/chartplotter
    c: Chartplotter off
    s: The anchor alarm serves no purpose with no one aboard
    when:
      has_category:
      - navigation_and_electronics
