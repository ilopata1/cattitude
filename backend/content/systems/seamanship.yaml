# Purpose: Curated seamanship system — knots, fenders, and line names.
# Used by: content.assembler.build_seamanship_module
# Module: system / seamanship
#

id: seamanship
icon: 🪢
title: Seamanship
subtitle: Knots, fenders, and the names of the lines
locs:
- cockpit
- bow
summary: Three knots, how to handle fenders, and — on a sailing boat — what the lines are called.
learnChecks:
- Tied a clove hitch, a round turn and two half hitches, and a bowline
- Brought a fender aboard before undoing its knot
sections:
- t: Fenders
  type: list
  items:
  - c: Bring the fender aboard before you undo the knot. Fenders are light and blow overboard easily.
  - c: Only put fenders out if you can tie a clove hitch or a round turn and two half hitches. Both are in the Knots section below.
- t: Knots
  type: photo
  html: knots
- t: What the lines are called
  type: list
  when:
    is_sailing: true
  items:
  - c: There are only two ropes on a boat — the bell rope and the bolt rope. Everything else has its own name.
  - c: Halyards pull sails up. Sheets, and sometimes guys, pull sails in.
  - c: The topping lift holds up the end of the boom. Furling lines twist a headsail away. Lazy jacks keep the mainsail from falling all over the deck.
  - c: Stays hold the mast up, including the forestay the jib is attached to. Stanchions and lifelines are the guard around the deck.
  - c: Mooring lines, or warps, attach the boat to the dock. The anchor is mostly on chain; when the chain runs out, an anchor warp follows.
  - c: "{sails_on_this_boat}"
    when:
      has_sail_inventory: true
  - c: Jacklines run {jackline_phrase}. You can clip on to them in heavy weather.
    when:
      has_jacklines: true
