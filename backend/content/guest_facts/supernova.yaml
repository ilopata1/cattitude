# Purpose: Handbook facts for Supernova only. Not shared defaults.
# Used by: scripts/verify_content_library.py
#

lifeRaft:
  location: under the seat at the aft of the cockpit
manualBilge:
  location: the cockpit
swimLadders:
- label: Stern ladder
  location: the stern of the starboard hull
  deploy: ""
- label: Emergency ladder
  location: towards the aft of the starboard hull
  deploy: Pull down on the rope to release the ladder.
waste:
  routing: The galley island has two circular hatches. The one nearer the aft goes straight to the sea and is for organic waste. The other goes into a bin, also reached through a cupboard, for recyclables.
  organicOverboard: true
headsFlushWater: fresh
holdToDim: true
hasTrampoline: true
hotWater:
  source: >-
    the 90 L tank in the starboard engine bay; it heats when the starboard
    engine runs or when the electric heater is on — red light under the CZone
    console
waterTanks:
  summary: two 270 L tanks, one under the bed in each aft cabin
autopilot:
  standby: press STANDBY on the pilot control beside the engine levers; the wheel is then live
cabinNames:
  - port forward
  - port aft
  - starboard forward
  - starboard aft
moorsSternTo: true
galleyStove: induction
